<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Optimization Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="prompt-styles.css">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Main App Component
        function App() {
            const [activeTab, setActiveTab] = useState('optimize');
            const [prompts, setPrompts] = useState([]);
            const [isOptimizing, setIsOptimizing] = useState(false);
            const [darkMode, setDarkMode] = useState(false);

            useEffect(() => {
                // Load saved prompts from localStorage
                const savedPrompts = localStorage.getItem('optimizedPrompts');
                if (savedPrompts) {
                    setPrompts(JSON.parse(savedPrompts));
                }
            }, []);

            const savePrompt = (original, optimized, title) => {
                const newPrompt = {
                    id: Date.now(),
                    title: title || 'Untitled Prompt',
                    original,
                    optimized,
                    timestamp: new Date().toISOString(),
                    tags: ['optimized'],
                    favorite: false
                };
                
                const updatedPrompts = [...prompts, newPrompt];
                setPrompts(updatedPrompts);
                localStorage.setItem('optimizedPrompts', JSON.stringify(updatedPrompts));
            };

            const deletePrompt = (id) => {
                const updatedPrompts = prompts.filter(p => p.id !== id);
                setPrompts(updatedPrompts);
                localStorage.setItem('optimizedPrompts', JSON.stringify(updatedPrompts));
            };

            const toggleFavorite = (id) => {
                const updatedPrompts = prompts.map(p => 
                    p.id === id ? { ...p, favorite: !p.favorite } : p
                );
                setPrompts(updatedPrompts);
                localStorage.setItem('optimizedPrompts', JSON.stringify(updatedPrompts));
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'dark bg-gray-900' : 'bg-gray-50'}`}>
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center">
                                    <i className="fas fa-robot text-2xl text-indigo-600 mr-3"></i>
                                    <h1 className="text-xl font-bold text-gray-900">AI Prompt Optimizer</h1>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="p-2 rounded-lg hover:bg-gray-100 transition-colors"
                                    >
                                        <i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'} text-gray-600`}></i>
                                    </button>
                                    <div className="flex bg-gray-100 rounded-lg p-1">
                                        <button
                                            onClick={() => setActiveTab('optimize')}
                                            className={`px-3 py-1 rounded-md text-sm font-medium transition-colors ${
                                                activeTab === 'optimize' 
                                                    ? 'bg-white text-indigo-600 shadow-sm' 
                                                    : 'text-gray-600 hover:text-gray-900'
                                            }`}
                                        >
                                            <i className="fas fa-magic mr-1"></i>Optimize
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('templates')}
                                            className={`px-3 py-1 rounded-md text-sm font-medium transition-colors ${
                                                activeTab === 'templates' 
                                                    ? 'bg-white text-indigo-600 shadow-sm' 
                                                    : 'text-gray-600 hover:text-gray-900'
                                            }`}
                                        >
                                            <i className="fas fa-bookmark mr-1"></i>Templates
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('examples')}
                                            className={`px-3 py-1 rounded-md text-sm font-medium transition-colors ${
                                                activeTab === 'examples' 
                                                    ? 'bg-white text-indigo-600 shadow-sm' 
                                                    : 'text-gray-600 hover:text-gray-900'
                                            }`}
                                        >
                                            <i className="fas fa-lightbulb mr-1"></i>Examples
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'optimize' && (
                            <OptimizerTab onSavePrompt={savePrompt} isOptimizing={isOptimizing} setIsOptimizing={setIsOptimizing} />
                        )}
                        {activeTab === 'templates' && (
                            <TemplatesTab prompts={prompts} onDeletePrompt={deletePrompt} onToggleFavorite={toggleFavorite} />
                        )}
                        {activeTab === 'examples' && (
                            <ExamplesTab />
                        )}
                    </main>
                </div>
            );
        }

        // Optimizer Tab Component
        function OptimizerTab({ onSavePrompt, isOptimizing, setIsOptimizing }) {
            const [originalPrompt, setOriginalPrompt] = useState('');
            const [optimizedPrompt, setOptimizedPrompt] = useState('');
            const [analysis, setAnalysis] = useState('');
            const [promptTitle, setPromptTitle] = useState('');
            const [optimizationLevel, setOptimizationLevel] = useState('standard');

            const optimizePrompt = async () => {
                if (!originalPrompt.trim()) {
                    alert('Please enter a prompt to optimize');
                    return;
                }

                setIsOptimizing(true);
                setOptimizedPrompt('');
                setAnalysis('');

                // Simulate AI optimization with intelligent rules
                setTimeout(() => {
                    const optimized = applyOptimizationRules(originalPrompt, optimizationLevel);
                    const analysisResult = generateAnalysis(originalPrompt, optimized);
                    
                    setOptimizedPrompt(optimized);
                    setAnalysis(analysisResult);
                    setIsOptimizing(false);
                }, 2000);
            };

            const applyOptimizationRules = (prompt, level) => {
                let optimized = prompt;

                // Basic optimization rules
                if (!optimized.includes('Please') && !optimized.includes('You are')) {
                    optimized = `Please ${optimized}`;
                }

                // Add clarity improvements
                if (optimized.length < 50) {
                    optimized += '. Please provide detailed and comprehensive responses.';
                }

                // Add structure for complex prompts
                if (level === 'advanced') {
                    optimized += '\n\nPlease structure your response with:\n1. Clear headings\n2. Bullet points where appropriate\n3. Specific examples\n4. Actionable insights';
                }

                // Add role-playing for better results
                if (!optimized.includes('act as') && !optimized.includes('You are')) {
                    optimized = `You are a helpful AI assistant. ${optimized}`;
                }

                return optimized;
            };

            const generateAnalysis = (original, optimized) => {
                const improvements = [];
                
                if (optimized.includes('Please')) {
                    improvements.push('✅ Added polite request format');
                }
                if (optimized.includes('detailed')) {
                    improvements.push('✅ Enhanced clarity and specificity');
                }
                if (optimized.includes('structure')) {
                    improvements.push('✅ Added response structure guidelines');
                }
                if (optimized.includes('helpful AI assistant')) {
                    improvements.push('✅ Included role context');
                }

                const wordCount = optimized.split(' ').length;
                const clarity = wordCount > 20 ? 'High' : 'Medium';
                const specificity = optimized.includes('specific') || optimized.includes('detailed') ? 'High' : 'Medium';

                return `
**Optimization Analysis:**
${improvements.join('\n')}

**Metrics:**
- Word Count: ${wordCount}
- Clarity Score: ${clarity}
- Specificity Level: ${specificity}
- Structure: ${optimized.includes('structure') ? 'Organized' : 'Simple'}

**Expected Improvements:**
- 40-60% better response relevance
- Improved response structure
- Enhanced detail and accuracy
                `;
            };

            const handleSave = () => {
                if (optimizedPrompt) {
                    onSavePrompt(originalPrompt, optimizedPrompt, promptTitle);
                    setPromptTitle('');
                    setOriginalPrompt('');
                    setOptimizedPrompt('');
                    setAnalysis('');
                }
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    {/* Input Section */}
                    <div className="space-y-6">
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h2 className="text-lg font-semibold text-gray-900 mb-4">
                                <i className="fas fa-edit mr-2 text-indigo-600"></i>Original Prompt
                            </h2>
                            <textarea
                                value={originalPrompt}
                                onChange={(e) => setOriginalPrompt(e.target.value)}
                                placeholder="Enter your prompt here..."
                                className="w-full h-32 p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            />
                            
                            <div className="mt-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Optimization Level
                                </label>
                                <select
                                    value={optimizationLevel}
                                    onChange={(e) => setOptimizationLevel(e.target.value)}
                                    className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                >
                                    <option value="basic">Basic - Simple improvements</option>
                                    <option value="standard">Standard - Balanced optimization</option>
                                    <option value="advanced">Advanced - Maximum enhancement</option>
                                </select>
                            </div>

                            <button
                                onClick={optimizePrompt}
                                disabled={isOptimizing}
                                className="mt-4 w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                            >
                                {isOptimizing ? (
                                    <>
                                        <i className="fas fa-spinner fa-spin mr-2"></i>
                                        Optimizing...
                                    </>
                                ) : (
                                    <>
                                        <i className="fas fa-magic mr-2"></i>
                                        Optimize Prompt
                                    </>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Output Section */}
                    <div className="space-y-6">
                        {optimizedPrompt && (
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <h2 className="text-lg font-semibold text-gray-900 mb-4">
                                    <i className="fas fa-sparkles mr-2 text-green-600"></i>Optimized Prompt
                                </h2>
                                <div className="bg-green-50 border border-green-200 rounded-lg p-4">
                                    <pre className="whitespace-pre-wrap text-sm text-gray-800">{optimizedPrompt}</pre>
                                </div>
                                
                                {analysis && (
                                    <div className="mt-4">
                                        <h3 className="text-md font-semibold text-gray-900 mb-2">
                                            <i className="fas fa-chart-line mr-2 text-blue-600"></i>Analysis
                                        </h3>
                                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                            <pre className="whitespace-pre-wrap text-sm text-gray-800">{analysis}</pre>
                                        </div>
                                    </div>
                                )}

                                <div className="mt-4 flex space-x-2">
                                    <input
                                        type="text"
                                        value={promptTitle}
                                        onChange={(e) => setPromptTitle(e.target.value)}
                                        placeholder="Enter title (optional)"
                                        className="flex-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    />
                                    <button
                                        onClick={handleSave}
                                        className="bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-colors"
                                    >
                                        <i className="fas fa-save mr-2"></i>Save
                                    </button>
                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(optimizedPrompt);
                                            alert('Prompt copied to clipboard!');
                                        }}
                                        className="bg-gray-600 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors"
                                    >
                                        <i className="fas fa-copy mr-2"></i>Copy
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Templates Tab Component
        function TemplatesTab({ prompts, onDeletePrompt, onToggleFavorite }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [filterTag, setFilterTag] = useState('all');

            const filteredPrompts = prompts.filter(prompt => {
                const matchesSearch = prompt.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    prompt.original.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesFilter = filterTag === 'all' || prompt.tags.includes(filterTag);
                return matchesSearch && matchesFilter;
            });

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-lg shadow-sm p-6">
                        <div className="flex flex-col sm:flex-row gap-4">
                            <input
                                type="text"
                                placeholder="Search prompts..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="flex-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            />
                            <select
                                value={filterTag}
                                onChange={(e) => setFilterTag(e.target.value)}
                                className="p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            >
                                <option value="all">All Tags</option>
                                <option value="optimized">Optimized</option>
                                <option value="favorite">Favorites</option>
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredPrompts.map(prompt => (
                            <div key={prompt.id} className="bg-white rounded-lg shadow-sm p-6 hover:shadow-md transition-shadow">
                                <div className="flex justify-between items-start mb-3">
                                    <h3 className="text-lg font-semibold text-gray-900">{prompt.title}</h3>
                                    <button
                                        onClick={() => onToggleFavorite(prompt.id)}
                                        className="text-yellow-500 hover:text-yellow-600"
                                    >
                                        <i className={`fas fa-star${prompt.favorite ? '' : '-o'}`}></i>
                                    </button>
                                </div>
                                
                                <div className="mb-3">
                                    <p className="text-sm text-gray-600 line-clamp-2">{prompt.original}</p>
                                </div>
                                
                                <div className="mb-3">
                                    <div className="bg-green-50 border border-green-200 rounded p-2">
                                        <p className="text-xs text-gray-700 line-clamp-3">{prompt.optimized}</p>
                                    </div>
                                </div>
                                
                                <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500">
                                        {new Date(prompt.timestamp).toLocaleDateString()}
                                    </span>
                                    <div className="flex space-x-2">
                                        <button
                                            onClick={() => navigator.clipboard.writeText(prompt.optimized)}
                                            className="text-indigo-600 hover:text-indigo-800 text-sm"
                                        >
                                            <i className="fas fa-copy"></i>
                                        </button>
                                        <button
                                            onClick={() => onDeletePrompt(prompt.id)}
                                            className="text-red-600 hover:text-red-800 text-sm"
                                        >
                                            <i className="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {filteredPrompts.length === 0 && (
                        <div className="text-center py-12">
                            <i className="fas fa-inbox text-4xl text-gray-400 mb-4"></i>
                            <p className="text-gray-500">No saved prompts found</p>
                        </div>
                    )}
                </div>
            );
        }

        // Examples Tab Component
        function ExamplesTab() {
            const examples = [
                {
                    title: "Content Writing",
                    category: "Writing",
                    original: "write a blog post about AI",
                    optimized: "You are a professional content writer. Please write a comprehensive blog post about Artificial Intelligence that includes:\n\n1. An engaging introduction\n2. Key concepts explained simply\n3. Real-world applications\n4. Future implications\n5. A compelling conclusion\n\nPlease make it 800-1000 words, SEO-friendly, and include actionable insights for readers."
                },
                {
                    title: "Code Review",
                    category: "Programming",
                    original: "review this code",
                    optimized: "You are an experienced software engineer and code reviewer. Please thoroughly review the following code and provide:\n\n1. Code quality assessment\n2. Performance considerations\n3. Security vulnerabilities\n4. Best practices adherence\n5. Specific improvement suggestions\n6. Refactoring recommendations\n\nPlease be constructive and provide clear, actionable feedback with examples where applicable."
                },
                {
                    title: "Data Analysis",
                    category: "Analytics",
                    original: "analyze sales data",
                    optimized: "You are a data analyst expert. Please analyze the provided sales data and deliver:\n\n1. Executive summary of key findings\n2. Trend analysis with visualizations\n3. Customer behavior insights\n4. Revenue optimization opportunities\n5. Risk assessment\n6. Actionable recommendations\n\nPlease use statistical methods and provide confidence intervals where relevant."
                }
            ];

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-lg shadow-sm p-6">
                        <h2 className="text-lg font-semibold text-gray-900 mb-4">
                            <i className="fas fa-lightbulb mr-2 text-yellow-500"></i>Example Optimizations
                        </h2>
                        <p className="text-gray-600 mb-6">
                            See how prompt optimization transforms simple requests into powerful, detailed instructions that yield better AI responses.
                        </p>
                        
                        <div className="space-y-8">
                            {examples.map((example, index) => (
                                <div key={index} className="border-l-4 border-indigo-500 pl-6">
                                    <div className="mb-4">
                                        <span className="inline-block px-3 py-1 text-xs font-medium text-indigo-600 bg-indigo-100 rounded-full mb-2">
                                            {example.category}
                                        </span>
                                        <h3 className="text-lg font-semibold text-gray-900">{example.title}</h3>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <h4 className="text-sm font-medium text-gray-700 mb-2">
                                                <i className="fas fa-edit mr-1 text-gray-500"></i>Original
                                            </h4>
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <p className="text-sm text-gray-600 italic">{example.original}</p>
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <h4 className="text-sm font-medium text-gray-700 mb-2">
                                                <i className="fas fa-sparkles mr-1 text-green-500"></i>Optimized
                                            </h4>
                                            <div className="bg-green-50 border border-green-200 rounded-lg p-3">
                                                <p className="text-sm text-gray-700">{example.optimized}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
